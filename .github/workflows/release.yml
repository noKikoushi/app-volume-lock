name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/AppVolumeLock.exe dist/AppVolumeLock.exe
          $hash = (Get-FileHash dist/AppVolumeLock.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/AppVolumeLock.exe.sha256", "$hash  AppVolumeLock.exe`n")
          "HASH=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppVolumeLock
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Download **AppVolumeLock.exe** below and run it. It installs itself for your user (no admin rights) and opens next to the tray. Running a newer download updates it.

          If Windows shows "Windows protected your PC", click **More info → Run anyway** (see [Security and privacy](https://github.com/${{ github.repository }}#security-and-privacy)).

          Built by GitHub Actions from this tag.
          SHA256: ``$env:HASH``
          VirusTotal: (link added after publishing)
          "@
          gh release create "${{ github.ref_name }}" dist/AppVolumeLock.exe dist/AppVolumeLock.exe.sha256 --title "App Volume Lock ${{ github.ref_name }}" --notes "$notes"
