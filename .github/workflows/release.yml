name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  id-token: write     # build provenance (attestation)
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/AppVolumeLock.exe dist/AppVolumeLock.exe
          $hash = (Get-FileHash dist/AppVolumeLock.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/AppVolumeLock.exe.sha256", "$hash  AppVolumeLock.exe`n")
          "HASH=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # proof that the exe was built here from this commit: gh attestation verify AppVolumeLock.exe -R <owner>/app-volume-lock
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/AppVolumeLock.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppVolumeLock
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Installation

          Download ``AppVolumeLock.exe`` from the assets below and run it. The application installs itself for the current user (no administrator rights required) and opens next to the notification area. Running a newer release updates an existing installation.

          The executable is not code-signed, so Windows SmartScreen may display *Windows protected your PC*. Select **More info → Run anyway**. See [Security and privacy](https://github.com/${{ github.repository }}#security-and-privacy).

          ## Changes

          (to be added)

          ## Verification

          | | |
          |---|---|
          | SHA256 | ``$env:HASH`` |
          | Build attestation | ``gh attestation verify AppVolumeLock.exe --repo ${{ github.repository }}`` |
          | VirusTotal | Pending |

          Built by GitHub Actions from this tag.
          "@
          gh release create "${{ github.ref_name }}" dist/AppVolumeLock.exe dist/AppVolumeLock.exe.sha256 --title "App Volume Lock ${{ github.ref_name }}" --notes "$notes"
